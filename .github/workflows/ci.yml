name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # 片方が落ちても、もう片方は最後まで確かめる
      fail-fast: false
      matrix:
        app: [signage, web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      # tsc -b && vite build。テストのファイルの型も、ここで確かめる
      - run: npm run build
      # webにはまだテストが無いので、testのスクリプトがあるアプリだけで動かす
      - run: npm test --if-present
